name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install analysis tools
        # Only the tools needed for static analysis — no heavy runtime deps
        # (nmap, weasyprint, ...) required just to lint/type-check/scan.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.15 mypy==2.2.0 bandit==1.9.4

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      # Optional: adopt `ruff format` later. Run `ruff format .` once, commit the
      # reformat on its own branch, then add a blocking step here:
      #   - name: Ruff (format check)
      #     run: ruff format --check .

      - name: Bandit (security scan)
        # Config (excludes + skips) lives in pyproject.toml [tool.bandit].
        run: bandit -c pyproject.toml -r . -q

      - name: Mypy (type check — informational)
        # Non-blocking: the codebase is largely untyped and SQLAlchemy 2.x emits
        # false positives without its removed mypy plugin. Kept visible so type
        # coverage can be improved over time, but does not fail the build yet.
        continue-on-error: true
        run: mypy .
